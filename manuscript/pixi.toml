[workspace]
authors = ["Spencer Clark <spencerc@allenai.org>"]
channels = ["conda-forge"]
name = "ace2s-shield-plus-paper"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
jupyterlab = "jupyter lab"

[dependencies]
python = "3.13.*"
cartopy = "*"
cftime = "*"
dask = "*"
distributed = "*"
fsspec = "*"
gcsfs = "*"
h5netcdf = "*"
